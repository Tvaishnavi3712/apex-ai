name: caas_node_certification_24_12
version: 1.0.0
description: Imported from Robot Framework suite “Verizon Far Edge Certification Suite
  24.12”
industry: telecommunications
category: certification
intent: Run the certification coverage previously held in the Robot Framework suite
  “Verizon Far Edge Certification Suite 24.12”. The suite contributed 248 tests across
