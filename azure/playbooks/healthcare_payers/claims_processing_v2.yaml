# CBTS Apex AI Platform - Claims Processing Playbook (Production-Ready)
# Healthcare Payer Claims Adjudication with Complete Business Rules
# Version 2.0 - Full Context-Driven Implementation

name: claims_processing_v2
version: "2.0.0"
description: "Production-ready medical claims processing with comprehensive fee schedules, CCI edits, and adjudication rules"
industry: healthcare_payers
category: claims_management

# =============================================================================
# INTENT - What this playbook accomplishes
# =============================================================================
intent: |
  Process medical claims through a complete adjudication workflow:
  1. Validate claim format and required fields
  2. Verify member eligibility on date of service
  3. Check provider credentials and network status
  4. Apply CCI edits and unbundling rules
  5. Validate medical necessity using clinical guidelines
  6. Calculate allowed amounts using contracted fee schedules
  7. Apply member cost sharing (deductible, coinsurance, copay)
  8. Detect fraud indicators using pattern analysis
  9. Route for appropriate approval or denial
  10. Generate EOB and remittance advice

# =============================================================================
# OUTPUT - What this playbook produces
# =============================================================================
output:
  - name: adjudicated_claim
    type: structured_data
    description: "Fully processed claim with payment determination"
    schema:
      claim_id: string
      adjudication_status: enum[approved, denied, pended, partial]
      denial_codes: array
      allowed_amount: number
      member_responsibility: number
      plan_payment: number
      processing_notes: array

  - name: explanation_of_benefits
    type: document
    description: "Member-facing EOB document"

  - name: remittance_advice
    type: edi_835
    description: "Provider payment remittance"

# =============================================================================
# CONTEXT - Complete Business Rules Configuration
# =============================================================================
context:

  # ---------------------------------------------------------------------------
  # PLAN CONFIGURATION - Different rules per plan type
  # ---------------------------------------------------------------------------
  plan_configurations:
    PPO_STANDARD:
      plan_id: "PPO001"
      timely_filing_days: 365
      coordination_of_benefits: true
      out_of_network_allowed: true
      out_of_network_reduction: 0.70
      deductible_applies_to_oon: true

    HMO_BASIC:
      plan_id: "HMO001"
      timely_filing_days: 180
      coordination_of_benefits: true
      out_of_network_allowed: false
      referral_required: true
      pcp_required: true

    EPO_PLUS:
      plan_id: "EPO001"
      timely_filing_days: 365
      out_of_network_allowed: false
      emergency_oon_exception: true

