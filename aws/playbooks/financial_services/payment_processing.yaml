# CBTS Apex AI Platform - Payment Processing Runbook
# Natural Language Runbook following Sema4.ai pattern

name: payment_processing
version: "1.0.0"
description: "Automated payment batch processing and disbursement workflow"
industry: financial_services
category: accounts_payable

# =============================================================================
# INTENT
# =============================================================================
intent: |
  Process approved invoices and expense reports into payment batches, validate
  banking information, generate payment files for treasury, and track
  disbursements through completion.

# =============================================================================
# OUTPUT
# =============================================================================
output:
  - name: payment_batch
    type: structured_data
    description: "Payment batch ready for treasury processing"
    schema:
      batch_id: string
      total_amount: number
      payment_count: integer
      payment_method: string
      status: string

  - name: payment_file
    type: file_output
    description: "Generated payment file (ACH/Wire/Check)"
    formats: ["NACHA", "ISO20022", "CSV"]

  - name: remittance_notifications
    type: notification_batch
    description: "Remittance advices sent to vendors"
    schema:
      sent_count: integer
      failed_count: integer

# =============================================================================
# CONTEXT
# =============================================================================
context:
  payment_methods:
    ach:
      cutoff_time: "14:00 ET"
      processing_days: 2
      max_single_payment: 100000
    wire:
      cutoff_time: "16:00 ET"
      processing_days: 0
      min_amount: 10000
    check:
      processing_days: 5
      signature_required_above: 10000
    virtual_card:
      instant: true
      max_single_payment: 25000

  batch_rules:
    max_batch_size: 500
    max_batch_amount: 10000000
    require_dual_approval_above: 1000000

  banking_validation:
    validate_ach_routing: true
    validate_account_status: true
    check_ofac_before_payment: true

# =============================================================================
# DATA SOURCES
# =============================================================================
data_sources:
  - name: approved_invoices
    type: dynamodb
    table: apex-invoices
    filter: "status = 'approved' AND payment_status = 'pending'"
    description: "Approved invoices awaiting payment"

  - name: approved_expenses
    type: dynamodb
    table: apex-expense-reports
    filter: "status = 'approved' AND payment_status = 'pending'"
    description: "Approved expense reports awaiting reimbursement"

  - name: vendor_banking
    type: dynamodb
    table: apex-vendor-banking
    description: "Vendor payment information"

  - name: employee_banking
    type: dynamodb
    table: apex-employee-banking
    description: "Employee direct deposit information"

# =============================================================================
# ACTIONS
# =============================================================================
actions:
  - name: validate_banking
    action_id: financial_services.bank_validate
    description: "Validate banking information before payment"

  - name: sanctions_check
    action_id: financial_services.sanctions_check
    description: "Pre-payment OFAC screening"

  - name: generate_ach_file
    action_id: financial_services.generate_nacha
    description: "Generate NACHA ACH payment file"

  - name: generate_wire
    action_id: financial_services.generate_wire
    description: "Generate wire transfer instructions"

  - name: send_remittance
    action_id: financial_services.send_remittance
    description: "Send remittance advice to payee"

  - name: treasury_approval
    action_id: financial_services.treasury_approve
    description: "Route batch for treasury approval"

  - name: record_payment
    action_id: financial_services.payment_record
    description: "Record payment in ledger"

# =============================================================================
# RECIPE
# =============================================================================
recipe: |
  ## Payment Processing Workflow

  ### Step 1: Payment Queue Collection
  Gather approved items ready for payment:
  1. Query approved invoices with pending payment status
  2. Query approved expense reports with pending payment status
  3. Check payment due dates and prioritize accordingly
  4. Group by payment method preference
  5. Create work item for batch processing

  ### Step 2: Banking Validation
  Validate payment information for each payee:
  1. Use `validate_banking` to verify account status
  2. For ACH, validate routing number against Federal Reserve
  3. For wire, validate SWIFT code format
  4. Flag any invalid or unverified accounts
  5. Route banking issues to AP for resolution

  ### Step 3: Compliance Screening
  Pre-payment compliance checks:
  1. Use `sanctions_check` for all payees
  2. Screen against updated OFAC SDN list
  3. Any hits immediately halt payment and escalate
  4. Document screening results for audit

  ### Step 4: Batch Creation
  Group payments into processing batches:
  1. Separate by payment method (ACH, Wire, Check)
  2. Respect batch size limits (max 500 per batch)
  3. Respect batch amount limits ($10M max)
  4. Create separate batches for international payments
  5. Assign batch IDs and create tracking records

  ### Step 5: Payment File Generation
  Generate payment files by type:

  For ACH Payments:
  1. Use `generate_ach_file` to create NACHA format file
  2. Validate file format and totals
  3. Apply company ID and originator information
  4. Generate balanced file with control records

  For Wire Transfers:
  1. Use `generate_wire` for each wire payment
  2. Include all required beneficiary information
  3. Add payment reference and remittance data
  4. Queue for treasury release

  For Checks:
  1. Generate check print file
  2. Include stub with remittance details
  3. Flag checks over $10,000 for signature

  ### Step 6: Treasury Approval
  Route for treasury approval:
  1. Calculate total batch value
  2. For batches over $1M, require dual treasury approval
  3. Use `treasury_approval` to route to treasury team
  4. Include batch summary and individual payment details
  5. Set approval deadline based on cutoff times

  ### Step 7: File Transmission
  Transmit approved payment files:
  1. Encrypt payment files per bank requirements
  2. Transmit via secure channel (SFTP/API)
  3. Capture transmission confirmation
  4. Update payment status to "transmitted"

  ### Step 8: Remittance & Recording
  Complete payment processing:
  1. Use `send_remittance` to email remittance advice
  2. Include invoice/expense references in remittance
  3. Use `record_payment` to update accounting ledger
  4. Mark invoices/expenses as paid
  5. Update vendor/employee payment history

  ### Exception Handling
  - Banking validation fails: Hold payment, notify AP
  - Sanctions hit: Escalate to compliance, do not pay
  - File transmission fails: Retry, alert treasury
  - Approval timeout: Escalate to treasury manager

# =============================================================================
# TRIGGERS
# =============================================================================
triggers:
  - type: schedule
    cron: "0 12 * * 1-5"
    timezone: "America/New_York"
    description: "Daily payment run at noon ET, weekdays"

  - type: api
    endpoint: /api/v1/run-payment-batch
    method: POST
    description: "Manual payment batch trigger"

  - type: threshold
    condition: "pending_payment_count > 100"
    description: "Trigger when pending payments exceed threshold"

# =============================================================================
# WORKER CONFIGURATION
# =============================================================================
worker:
  queue: apex-payment-processing-queue
  concurrency: 1  # Single thread for payment processing
  timeout_seconds: 1800
  retry_policy:
    max_attempts: 1  # No auto-retry for payments

# =============================================================================
# METADATA
# =============================================================================
metadata:
  created_by: apex-platform
  created_at: "2024-01-15"
  tags:
    - accounts-payable
    - payments
    - treasury
    - financial-services
