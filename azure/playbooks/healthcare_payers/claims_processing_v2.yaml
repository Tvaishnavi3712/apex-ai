  # ---------------------------------------------------------------------------
  # CCI EDITS - Correct Coding Initiative Unbundling Rules
  # Column 1 = Comprehensive code, Column 2 = Component code (cannot bill together)
  # ---------------------------------------------------------------------------
  cci_edits:
    # E&M Unbundling - Cannot bill multiple E&M same day same provider
    em_same_day:
      - {column1: "99215", column2: "99214", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}
      - {column1: "99215", column2: "99213", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}
      - {column1: "99214", column2: "99213", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}
      - {column1: "99214", column2: "99212", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}
      - {column1: "99205", column2: "99204", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}
      - {column1: "99205", column2: "99203", modifier_allowed: false, reason: "Cannot bill higher and lower E&M same encounter"}

    # Lab Panel Unbundling - Cannot bill panel + individual components
    lab_panels:
      - {column1: "80053", column2: "80048", modifier_allowed: false, reason: "CMP includes BMP components"}
      - {column1: "80053", column2: "84443", modifier_allowed: false, reason: "CMP includes glucose"}
      - {column1: "80048", column2: "82947", modifier_allowed: false, reason: "BMP includes glucose"}
      - {column1: "80048", column2: "82565", modifier_allowed: false, reason: "BMP includes creatinine"}
      - {column1: "80061", column2: "82465", modifier_allowed: false, reason: "Lipid panel includes cholesterol"}
      - {column1: "85025", column2: "85027", modifier_allowed: false, reason: "CBC includes automated count"}

    # Surgical Unbundling - Incision included in procedure
    surgical:
      - {column1: "27447", column2: "27446", modifier_allowed: false, reason: "TKR includes partial knee"}
      - {column1: "47562", column2: "47564", modifier_allowed: true, reason: "Lap chole - modifier 59 allowed for separate site"}
      - {column1: "45380", column2: "45378", modifier_allowed: false, reason: "Colonoscopy with biopsy includes diagnostic"}
      - {column1: "43239", column2: "43235", modifier_allowed: false, reason: "EGD with biopsy includes diagnostic"}

    # Injection Unbundling
    injections:
      - {column1: "96374", column2: "96372", modifier_allowed: false, reason: "IV push includes IM/SQ injection technique"}
      - {column1: "64483", column2: "64484", modifier_allowed: true, reason: "Additional level allowed with modifier"}

  # ---------------------------------------------------------------------------
  # MEDICAL NECESSITY - Diagnosis-Procedure Linkage Rules
  # ---------------------------------------------------------------------------
  medical_necessity_rules:
    # Total Knee Replacement - Valid diagnoses
    "27447":
      required_diagnoses:
        primary: ["M17.0", "M17.10", "M17.11", "M17.12", "M17.2", "M17.30", "M17.31", "M17.32"]
        description: "Primary osteoarthritis of knee"
      clinical_criteria:
        - "Conservative treatment failure documented (minimum 3 months)"
        - "Functional limitation score (WOMAC or similar)"
        - "Radiographic evidence of bone-on-bone contact"
        - "BMI documented (relative contraindication if >40)"
      required_documentation:
        - "Weight-bearing X-ray within 6 months"
        - "Physical therapy notes showing failed conservative care"
        - "Orthopedic evaluation with surgical recommendation"
      prior_auth_required: true

    # Total Hip Replacement - Valid diagnoses
    "27130":
      required_diagnoses:
        primary: ["M16.0", "M16.10", "M16.11", "M16.12", "M16.2", "M16.30", "M16.31", "M16.32", "M87.051", "M87.052"]
        description: "Primary osteoarthritis or avascular necrosis of hip"
      clinical_criteria:
        - "Harris Hip Score < 70"
        - "Failed conservative treatment minimum 6 weeks"
        - "Radiographic evidence of joint deterioration"
      required_documentation:
        - "Hip X-ray within 6 months"
        - "Harris Hip Score documentation"
        - "Orthopedic evaluation"
      prior_auth_required: true

    # MRI Brain - Valid diagnoses
    "70553":
      required_diagnoses:
        primary: ["G43.909", "G43.919", "R51.9", "G89.29", "R41.82", "G40.909"]
        secondary: ["C71.9", "D33.0", "D33.1", "D43.0", "I63.9", "G35"]
        description: "Headache, seizure, cognitive changes, suspected mass, MS, stroke"
      clinical_criteria:
        - "Neurological symptoms present"
        - "CT negative or inconclusive when mass suspected"
        - "Initial workup completed"
      prior_auth_required: false
      frequency_limit: "1 per 12 months unless clinical change"

    # Colonoscopy - Screening vs Diagnostic
    "45380":
      screening_criteria:
        age_requirement: 45
        frequency: "Every 10 years if normal, 5 years if polyps found"
        family_history_override: "Start 10 years before youngest affected relative"
      diagnostic_diagnoses:
        - "K92.1"   # Melena
        - "K92.2"   # GI hemorrhage
        - "K62.5"   # Rectal bleeding
        - "R19.5"   # Abnormal stool
        - "D50.0"   # Iron deficiency anemia
        - "K57.30"  # Diverticulosis
      prior_auth_required: false

    # Psychotherapy - Session frequency rules
    "90837":
      frequency_rules:
        initial_phase: {sessions_per_week: 2, duration_weeks: 4}
        active_treatment: {sessions_per_week: 1, duration_weeks: 12}
        maintenance: {sessions_per_month: 2, requires_review: true}
      required_diagnoses:
        - "F32.1"   # Major depression, moderate
        - "F32.2"   # Major depression, severe
        - "F33.1"   # Recurrent depression, moderate
        - "F41.1"   # Generalized anxiety disorder
        - "F43.10"  # PTSD
        - "F60.3"   # Borderline personality disorder
      documentation_requirements:
        - "Treatment plan with measurable goals"
        - "Progress notes each session"
        - "PHQ-9 or GAD-7 scores documented"
      prior_auth_required: false
      utilization_review_threshold: 24  # sessions per year

  # ---------------------------------------------------------------------------
  # MODIFIER RULES - When modifiers are required/allowed
  # ---------------------------------------------------------------------------
  modifier_rules:
    "25":
      description: "Significant, Separately Identifiable E&M"
      applies_to: ["99211", "99212", "99213", "99214", "99215", "99202", "99203", "99204", "99205"]
      rules:
        - "Required when E&M billed same day as procedure"
        - "Documentation must support separate condition or significantly more work"
        - "Cannot be used to unbundle global surgical package"
      payment_impact: "Allows separate E&M payment"

    "59":
      description: "Distinct Procedural Service"
      applies_to: ["surgical", "diagnostic"]
      rules:
        - "Different session, different procedure, different site, separate lesion"
        - "Documentation must clearly indicate distinct service"
        - "XE, XS, XP, XU modifiers preferred over 59"
      audit_flag: true

    "76":
      description: "Repeat Procedure by Same Physician"
      rules:
        - "Same procedure, same day, same physician"
        - "Medical necessity for repeat must be documented"

    "77":
      description: "Repeat Procedure by Another Physician"
      rules:
        - "Same procedure, same day, different physician"

    "TC":
      description: "Technical Component"
      applies_to: ["radiology", "diagnostic"]
      rules:
        - "Facility billing for equipment and technician only"
        - "Cannot bill with global code"
      payment_percent: 0.60

    "26":
      description: "Professional Component"
      applies_to: ["radiology", "diagnostic"]
      rules:
        - "Physician interpretation only"
        - "Cannot bill with global code"
      payment_percent: 0.40

  # ---------------------------------------------------------------------------
  # FRAUD DETECTION RULES - Pattern-based fraud indicators
  # ---------------------------------------------------------------------------
  fraud_detection_rules:
    # Impossible Day Rules
    impossible_day:
      max_office_visits_per_day: 40
      max_surgical_procedures_per_day: 8
      max_evaluation_hours_per_day: 16  # Based on time-based E&M
      alert_threshold: 0.80  # Alert at 80% of max

    # Upcoding Detection
    upcoding_patterns:
      em_distribution_alert:
        description: "Flag if >50% of E&M are highest level"
        "99215_threshold": 0.50
        "99205_threshold": 0.40
        comparison_basis: "peer_specialty_average"
      surgical_upcoding:
        bilateral_without_modifier: true
        multiple_units_unusual: true

    # Unbundling Detection
    unbundling_patterns:
      - pattern: "Separate billing of lab panel components"
        codes: ["80053_components", "80048_components", "80061_components"]
        action: "deny_components_pay_panel"
      - pattern: "Global surgery unbundling"
        window_days: 90
        action: "apply_global_period_rules"

    # Duplicate Billing
    duplicate_detection:
      same_provider_same_dos: "deny_duplicate"
      same_member_same_dos_different_provider:
        action: "review"
        exceptions: ["emergency", "second_opinion_documented"]
      timeframe_days: 30

    # Outlier Detection
    outlier_thresholds:
      charge_to_allowed_ratio:
        alert_threshold: 5.0    # Alert if charges > 5x allowed
        deny_threshold: 10.0    # Auto-deny if charges > 10x allowed
      units_per_service:
        "96372": {max_units: 4, review_threshold: 3}
        "96374": {max_units: 8, review_threshold: 5}
        "90837": {max_units: 1, review_threshold: 1}

  # ---------------------------------------------------------------------------
  # COST SHARING RULES - Member responsibility calculations
  # ---------------------------------------------------------------------------
  cost_sharing:
    deductible_rules:
      application_order: ["deductible", "coinsurance", "copay"]
      family_deductible_multiplier: 2.0
      deductible_carryover_months: 3  # Q4 charges can apply to next year

    coinsurance_by_service:
      in_network:
        default: 0.20
        preventive: 0.00
        emergency: 0.20
        behavioral_health: 0.20
        specialist: 0.20
      out_of_network:
        default: 0.40
        emergency: 0.20  # Emergency parity

    copay_schedule:
      in_network:
        primary_care: 25
        specialist: 50
        urgent_care: 75
        emergency: 250  # Waived if admitted
        behavioral_health: 25
      out_of_network:
        primary_care: 50
        specialist: 100
        urgent_care: 150
        emergency: 250

    out_of_pocket_maximum:
      individual: 8550   # 2024 ACA maximum
      family: 17100
      includes: ["deductible", "coinsurance", "copays"]
      excludes: ["premiums", "non_covered_services", "balance_billing"]

  # ---------------------------------------------------------------------------
  # DENIAL CODES - CARC/RARC codes for claim denials
  # ---------------------------------------------------------------------------
  denial_codes:
    "CO-4": {description: "Procedure code inconsistent with modifier", action: "deny"}
    "CO-11": {description: "Diagnosis inconsistent with procedure", action: "deny"}
    "CO-15": {description: "Authorization required but not obtained", action: "deny"}
    "CO-16": {description: "Claim lacks information needed for adjudication", action: "pend"}
    "CO-18": {description: "Duplicate claim", action: "deny"}
    "CO-29": {description: "Timely filing limit exceeded", action: "deny"}
    "CO-50": {description: "Not covered by payer", action: "deny"}
    "CO-96": {description: "Non-covered charge", action: "deny"}
    "CO-97": {description: "Payment included in allowance for another service", action: "deny"}
    "CO-150": {description: "Payer deems service not medically necessary", action: "deny"}
    "CO-197": {description: "Precertification/authorization absent", action: "deny"}
    "PR-1": {description: "Deductible amount", action: "member_responsibility"}
    "PR-2": {description: "Coinsurance amount", action: "member_responsibility"}
    "PR-3": {description: "Copay amount", action: "member_responsibility"}
    "OA-23": {description: "Payment adjusted - claim paid after audit", action: "adjust"}

  # ---------------------------------------------------------------------------
  # TIMELY FILING RULES - By payer type
  # ---------------------------------------------------------------------------
  timely_filing:
    commercial:
      standard_days: 365
      corrected_claim_days: 365
      appeal_days: 180
    medicare:
      standard_days: 365
      corrected_claim_days: 365
      appeal_days: 120
    medicaid:
      standard_days: 365
      varies_by_state: true
    workers_comp:
      standard_days: 180
      varies_by_state: true
    exceptions:
      - {reason: "retroactive_eligibility", extension_days: 90}
      - {reason: "coordination_of_benefits", extension_days: 60}
      - {reason: "subrogation", extension_days: 180}

# =============================================================================
# DATA SOURCES - Where to get information
# =============================================================================
data_sources:
  - name: claim_document
    type: s3_document
    input_parameter: document_s3_uri

  - name: member_eligibility
    type: cosmos_db
    table: apex-member-eligibility
    key_field: member_id

  - name: provider_network
    type: cosmos_db
    table: apex-provider-network
    key_fields: [npi, plan_id]

  - name: fee_schedule_overrides
    type: cosmos_db
    table: apex-fee-schedules
    description: "Customer-specific fee schedule overrides"

  - name: prior_authorizations
    type: cosmos_db
    table: apex-prior-auth
    key_field: auth_number

  - name: member_accumulators
    type: cosmos_db
    table: apex-accumulators
    key_field: member_id
    description: "Deductible/OOP accumulator tracking"

# =============================================================================
# ACTIONS - Lambda handlers to invoke
# =============================================================================
actions:
  - name: eligibility_verify
    action_id: healthcare_payers.eligibility_verify
    required: true
    timeout_seconds: 30

  - name: claims_adjudication
    action_id: healthcare_payers.claims_adjudication
    required: true
    timeout_seconds: 60

  - name: medical_necessity_check
    action_id: healthcare_payers.medical_necessity_check
    required: true
    timeout_seconds: 45

  - name: fraud_detection
    action_id: healthcare_payers.fraud_detection
    required: true
    timeout_seconds: 30

  - name: payment_calculate
    action_id: healthcare_payers.payment_calculate
    required: true
    timeout_seconds: 30

# =============================================================================
# RECIPE - Step-by-step adjudication process
# =============================================================================
recipe: |
  ## Claims Adjudication Workflow

  This recipe processes claims using the rules defined in `context`. All thresholds,
  fee schedules, and business rules are read from context - NOT hardcoded in actions.

  ---

  ### PHASE 1: CLAIM VALIDATION

  #### Step 1.1: Format Validation
  ```
  INPUT: Raw claim data
  RULES: None (structural validation)

  1. Verify claim type (CMS-1500 Professional or UB-04 Institutional)
  2. Check required fields present:
     - Member ID (required)
     - Provider NPI (required, must be 10 digits starting with 1 or 2)
     - Service date (required, format YYYY-MM-DD)
     - At least one procedure code (required)
     - At least one diagnosis code (required)
     - Billed amount > 0 (required)
  3. Validate NPI checksum using Luhn algorithm
  4. Validate ICD-10 format (letter + 2-7 alphanumeric)
  5. Validate CPT format (5 digits or 4 digits + modifier)

  OUTPUT: validation_result {valid: bool, errors: []}
  ```

  #### Step 1.2: Timely Filing Check
  ```
  INPUT: claim.service_date, claim.received_date
  RULES: context.timely_filing

  1. Determine payer type from member's plan
  2. Look up timely_filing.{payer_type}.standard_days
  3. Calculate days_since_service = received_date - service_date
  4. Check for exceptions in context.timely_filing.exceptions:
     - If retroactive_eligibility, add extension_days
     - If coordination_of_benefits, add extension_days
  5. If days_since_service > allowed_days:
     - DENY with code CO-29 from context.denial_codes

  OUTPUT: timely_filing_result {passed: bool, days_remaining: int}
  ```

  ---

  ### PHASE 2: ELIGIBILITY VERIFICATION

  #### Step 2.1: Member Lookup
  ```
  INPUT: claim.member_id, claim.service_date
  ACTION: eligibility_verify
  DATA: data_sources.member_eligibility

  1. Query member_eligibility table by member_id
  2. Check effective_date <= service_date <= term_date
  3. If not eligible:
     - DENY with appropriate code
     - Return member_status: "not_eligible"

  OUTPUT: eligibility {
    eligible: bool,
    plan_id: string,
    plan_type: string (maps to context.plan_configurations),
    coverage_level: string,
    pcp_id: string (for HMO)
  }
  ```

  #### Step 2.2: Benefit Verification
  ```
  INPUT: eligibility.plan_id, claim.procedure_codes
  RULES: context.plan_configurations.{plan_type}

  1. Look up plan configuration from context.plan_configurations
  2. For each procedure code:
     a. Check if service type is covered under plan
     b. Check if out_of_network_allowed (if provider is OON)
     c. Check if referral_required (HMO plans)
     d. Check if pcp_required (HMO plans)
  3. If service not covered:
     - DENY with code CO-50

  OUTPUT: benefit_check {covered: bool, limitations: [], exclusions: []}
  ```

  #### Step 2.3: Accumulator Lookup
  ```
  INPUT: claim.member_id
  DATA: data_sources.member_accumulators

  1. Query current year accumulators:
     - individual_deductible_met
     - individual_oop_met
     - family_deductible_met
     - family_oop_met
  2. Calculate remaining:
     - deductible_remaining = plan.deductible - deductible_met
     - oop_remaining = plan.oop_max - oop_met

  OUTPUT: accumulators {deductible_remaining, oop_remaining, ...}
  ```

  ---

  ### PHASE 3: PROVIDER VALIDATION

  #### Step 3.1: Network Status
  ```
  INPUT: claim.provider_npi, eligibility.plan_id
  DATA: data_sources.provider_network

  1. Query provider_network by (npi, plan_id)
  2. Determine network tier (Tier 1, Tier 2, OON)
  3. If OON and plan.out_of_network_allowed == false:
     - Check if service is emergency (Place of Service 23)
     - If emergency and plan.emergency_oon_exception, allow at in-network rates
     - Otherwise DENY with appropriate code

  OUTPUT: network_status {
    in_network: bool,
    tier: int,
    contracted_rate_applies: bool
  }
  ```

  #### Step 3.2: Provider Credentialing
  ```
  INPUT: claim.provider_npi, claim.procedure_codes

  1. Verify provider is credentialed for service type
  2. Verify provider license is active
  3. Check for sanctions (OIG exclusion list)
  4. If provider excluded:
     - DENY entire claim

  OUTPUT: credentialing {valid: bool, restrictions: []}
  ```

  ---

  ### PHASE 4: CLINICAL VALIDATION

  #### Step 4.1: CCI Edit Check
  ```
  INPUT: claim.procedure_codes, claim.modifiers
  RULES: context.cci_edits

  FOR each procedure_code_pair in claim:
    1. Check context.cci_edits.em_same_day for E&M conflicts
    2. Check context.cci_edits.lab_panels for lab unbundling
    3. Check context.cci_edits.surgical for surgical unbundling
    4. Check context.cci_edits.injections for injection unbundling

    FOR each matching edit:
      a. If modifier_allowed == true AND appropriate modifier present:
         - Allow both codes
      b. If modifier_allowed == false OR no modifier:
         - DENY column2 code with CO-97
         - Pay column1 code only

  OUTPUT: cci_result {
    codes_denied: [{code, reason, denial_code}],
    codes_allowed: [codes]
  }
  ```

  #### Step 4.2: Medical Necessity Check
  ```
  INPUT: claim.procedure_codes, claim.diagnosis_codes
  RULES: context.medical_necessity_rules
  ACTION: medical_necessity_check

  FOR each procedure_code:
    1. Look up context.medical_necessity_rules.{procedure_code}
    2. If rules exist:
       a. Check if any diagnosis_code matches required_diagnoses.primary
       b. If screening procedure, verify screening_criteria (age, frequency)
       c. If prior_auth_required, verify auth_number in data_sources.prior_authorizations
    3. If no matching diagnosis:
       - DENY with CO-11 (diagnosis inconsistent with procedure)
    4. If prior auth required but missing:
       - DENY with CO-197 (precertification absent)
    5. If frequency limit exceeded:
       - DENY with CO-150 (not medically necessary)

  OUTPUT: medical_necessity {
    passed: bool,
    denials: [{code, reason, supporting_codes}]
  }
  ```

  #### Step 4.3: Modifier Validation
  ```
  INPUT: claim.procedure_codes, claim.modifiers
  RULES: context.modifier_rules

  FOR each modifier:
    1. Look up context.modifier_rules.{modifier}
    2. Verify modifier applies_to this code type
    3. Validate modifier rules are satisfied
    4. If modifier "59" used:
       - Set audit_flag = true for post-payment review
    5. Determine payment_impact (e.g., TC = 60%, 26 = 40%)

  OUTPUT: modifier_validation {
    valid: bool,
    payment_adjustments: [{code, modifier, adjustment}]
  }
  ```

  ---

  ### PHASE 5: FRAUD DETECTION

  #### Step 5.1: Pattern Analysis
  ```
  INPUT: claim, provider_history, member_history
  RULES: context.fraud_detection_rules
  ACTION: fraud_detection

  1. Impossible Day Check:
     a. Count provider's claims for service_date
     b. Compare to context.fraud_detection_rules.impossible_day.max_office_visits_per_day
     c. If exceeds alert_threshold (80%), flag for review
     d. If exceeds max, PEND for investigation

  2. Upcoding Detection:
     a. Calculate provider's E&M distribution
     b. Compare to context.fraud_detection_rules.upcoding_patterns.em_distribution_alert
     c. If 99215 > 50% threshold, flag for review

  3. Duplicate Detection:
     a. Search for matching claims using context.fraud_detection_rules.duplicate_detection
     b. If same_provider_same_dos found, DENY with CO-18
     c. If different_provider but same_member_same_dos, REVIEW (unless exception applies)

  4. Outlier Detection:
     a. Calculate charge_to_allowed_ratio
     b. If > context.fraud_detection_rules.outlier_thresholds.charge_to_allowed_ratio.deny_threshold
        - DENY with fraud flag
     c. If > alert_threshold, flag for review

  OUTPUT: fraud_result {
    risk_score: 0-100,
    risk_level: low|medium|high|critical,
    flags: [{type, description, severity}],
    action: process|review|deny
  }
  ```

  ---

  ### PHASE 6: PRICING & PAYMENT

  #### Step 6.1: Fee Schedule Application
  ```
  INPUT: claim.procedure_codes, eligibility.plan_type, network_status
  RULES: context.fee_schedules
  DATA: data_sources.fee_schedule_overrides (for customer-specific rates)
  ACTION: payment_calculate

  FOR each procedure_code:
    1. Look up base rate from context.fee_schedules.{procedure_code}
    2. Calculate allowed amount:

       IF customer_override exists in fee_schedule_overrides:
         allowed = override_rate
       ELSE:
         base = fee_schedules.{code}.medicare
         multiplier = fee_schedules.{code}.commercial_multiplier
         allowed = base * multiplier

         IF facility_claim:
           allowed = allowed * fee_schedules.{code}.facility_reduction

         IF out_of_network:
           allowed = allowed * plan_configurations.{plan}.out_of_network_reduction

    3. Apply units: total_allowed = allowed * units
    4. Cap at billed amount: total_allowed = min(total_allowed, billed_amount)

  OUTPUT: pricing {
    line_items: [{code, units, billed, allowed, fee_schedule_used}],
    total_allowed: sum(allowed)
  }
  ```

  #### Step 6.2: Cost Sharing Calculation
  ```
  INPUT: pricing.total_allowed, accumulators, eligibility, network_status
  RULES: context.cost_sharing

  1. Determine service type for copay lookup

  2. Apply deductible (per context.cost_sharing.deductible_rules.application_order):
     deductible_applied = min(accumulators.deductible_remaining, total_allowed)
     amount_after_deductible = total_allowed - deductible_applied

  3. Apply coinsurance:
     IF in_network:
       rate = context.cost_sharing.coinsurance_by_service.in_network.{service_type}
     ELSE:
       rate = context.cost_sharing.coinsurance_by_service.out_of_network.{service_type}

     coinsurance_amount = amount_after_deductible * rate

  4. Apply copay:
     IF in_network:
       copay = context.cost_sharing.copay_schedule.in_network.{service_type}
     ELSE:
       copay = context.cost_sharing.copay_schedule.out_of_network.{service_type}

  5. Check OOP maximum:
     total_member = deductible_applied + coinsurance_amount + copay
     IF total_member > accumulators.oop_remaining:
       total_member = accumulators.oop_remaining
       plan_pays_extra = (deductible_applied + coinsurance_amount + copay) - total_member

  6. Calculate plan payment:
     plan_payment = total_allowed - total_member

  OUTPUT: cost_sharing {
    deductible_applied,
    coinsurance_applied,
    copay_applied,
    member_responsibility: total_member,
    plan_payment
  }
  ```

  ---

  ### PHASE 7: ADJUDICATION DECISION

  #### Step 7.1: Final Determination
  ```
  INPUT: All previous phase outputs

  1. Aggregate all denial codes from phases 1-5

  2. Determine final status:
     IF any line has denial:
       IF all lines denied: status = "denied"
       ELSE: status = "partial"
     ELSE IF fraud_result.action == "review":
       status = "pended"
     ELSE:
       status = "approved"

  3. For each denied line, map to CARC/RARC from context.denial_codes

  4. Update accumulators (async):
     - Add deductible_applied to member's deductible_met
     - Add member_responsibility to member's oop_met

  OUTPUT: adjudication {
    claim_id,
    status: approved|denied|partial|pended,
    total_billed,
    total_allowed,
    total_member_responsibility,
    total_plan_payment,
    line_results: [{code, status, allowed, member_resp, plan_pay, denial_codes}],
    processing_notes
  }
  ```

  ---

  ### PHASE 8: OUTPUT GENERATION

  #### Step 8.1: Generate EOB
  ```
  For member-facing explanation:
  1. Summarize services rendered
  2. Show billed vs allowed vs member responsibility
  3. Explain any denials in plain language
  4. Show remaining deductible/OOP
  ```

  #### Step 8.2: Generate 835 Remittance
  ```
  For provider payment:
  1. Format per X12 835 specification
  2. Include CARC/RARC codes for adjustments
  3. Include provider-level adjustments
  ```

# =============================================================================
# FACTORY CHAIN - Small Factory execution order
# =============================================================================
factory_chain:
  chain_id: claims_processing_v2
  description: "Production claims adjudication with context-driven rules"

  factories:
    - id: eligibility_verify
      action: eligibility_verify
      ai_enhanced: false
      context_keys: [plan_configurations, cost_sharing]
      timeout_seconds: 30

    - id: claims_adjudication
      action: claims_adjudication
      ai_enhanced: false
      depends_on: [eligibility_verify]
      context_keys: [cci_edits, modifier_rules, fee_schedules]
      timeout_seconds: 60

    - id: medical_necessity_check
      action: medical_necessity_check
      ai_enhanced: true
      depends_on: [claims_adjudication]
      context_keys: [medical_necessity_rules]
      timeout_seconds: 45

    - id: fraud_detection
      action: fraud_detection
      ai_enhanced: true
      depends_on: [claims_adjudication]
      context_keys: [fraud_detection_rules]
      timeout_seconds: 30

    - id: payment_calculate
      action: payment_calculate
      ai_enhanced: false
      depends_on: [medical_necessity_check, fraud_detection]
      context_keys: [fee_schedules, cost_sharing, denial_codes]
      timeout_seconds: 30

# =============================================================================
# TRIGGERS - How this playbook is invoked
# =============================================================================
triggers:
  - type: blob_event
    bucket: apex-claims-incoming
    prefix: claims/
    events: ["s3:ObjectCreated:*"]

  - type: api
    endpoint: /api/v1/adjudicate-claim
    method: POST

  - type: edi
    transaction_set: "837"

  - type: schedule
    cron: "0 */4 * * *"
    description: "Reprocess pended claims every 4 hours"

# =============================================================================
# WORKER CONFIGURATION
# =============================================================================
worker:
  queue: apex-claims-processing-queue
  concurrency: 100
  timeout_seconds: 300
  retry_policy:
    max_attempts: 3
    backoff_multiplier: 2
    initial_delay_seconds: 5
  dead_letter_queue: apex-claims-dlq

# =============================================================================
# METADATA
# =============================================================================
metadata:
  tags: [claims, adjudication, healthcare-payers, production, context-driven]
  version_notes: "Complete production-ready playbook with full context rules"
  last_updated: "2024-03-17"
  maintainer: "CBTS APEX Team"
