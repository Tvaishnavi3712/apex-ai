# CBTS Apex AI Platform - New Hire Onboarding Playbook
# Small Factory chain for employee onboarding automation
name: new_hire_onboarding
version: "1.0.0"
description: "Automate new hire onboarding using Small Factory pattern"
industry: hr
category: employee_onboarding

intent: |
  Streamline new hire onboarding by verifying identity documents,
  validating I-9, initiating background checks, enrolling benefits,
  and triggering IT provisioning.

output:
  - name: onboarding_status
    type: status
    schema:
      employee_id: string
      i9_complete: boolean
      background_status: string
      benefits_enrolled: boolean
      it_provisioned: boolean
  - name: compliance
    type: verification
    schema:
      i9_valid: boolean
      identity_verified: boolean
      ready_to_start: boolean

context:
  business_rules:
    - "I-9 Section 1 must be completed by first day of work"
    - "I-9 Section 2 must be completed within 3 business days"
    - "Background check must be initiated before start date"
    - "Benefits enrollment window is 30 days from start"

  document_requirements:
    list_a: [us_passport, permanent_resident_card, employment_authorization_document]
    list_b: [drivers_license, state_id, military_id]
    list_c: [social_security_card, birth_certificate]

  background_packages:
    entry_level: basic
    professional: standard
    management: comprehensive
    executive: executive

factory_chain: new_hire_onboarding

actions:
  - name: document_classify
    factory_id: document_classify
    required: true
    config:
      expected_types: [drivers_license, passport, social_security_card, birth_certificate, i9_form]

  - name: identity_verify
    factory_id: identity_verify
    required: true
    depends_on: [document_classify]
    config:
      require_list_a: false
      check_expiration: true

  - name: i9_validate
    factory_id: i9_validate
    required: true
    depends_on: [identity_verify]
    config:
      validate_dates: true

  - name: background_check
    factory_id: background_check
    required: true
    depends_on: [i9_validate]
    config:
      package: standard
      expedite: false

  - name: benefits_enroll
    factory_id: benefits_enroll
    required: true
    depends_on: [i9_validate]
    config:
      auto_enroll_defaults: true

  - name: provisioning_trigger
    factory_id: provisioning_trigger
    required: true
    depends_on: [background_check]

recipe: |
  ## New Hire Onboarding

  This playbook automates employee onboarding through a
  6-factory chain for compliance and provisioning.

  ### Factory Chain Flow

  ```
  [Documents Uploaded]
       │
       ▼
  ┌──────────────────┐
  │ Document Classify│
  └──────────────────┘
       │
       ▼
  ┌──────────────────┐
  │ Identity Verify  │
  └──────────────────┘
       │
       ▼
  ┌──────────────────┐
  │   I-9 Validate   │
  └──────────────────┘
       │
       ├──────────────────┐
       ▼                  ▼
  ┌──────────────┐  ┌──────────────┐
  │ Background   │  │   Benefits   │
  │    Check     │  │    Enroll    │
  └──────────────┘  └──────────────┘
       │
       ▼
  ┌──────────────────┐
  │  Provisioning    │
  │    Trigger       │
  └──────────────────┘
  ```

  ### Compliance Checks

  - I-9 completion timeline validation
  - Document expiration checking
  - Work authorization verification
  - E-Verify eligibility

triggers:
  - type: api
    endpoint: /api/v1/hr/onboard
  - type: webhook
    source: workday
    event: new_hire_created
  - type: form_submission
    form_id: new_hire_documents

worker:
  queue: apex-hr-onboarding-queue
  concurrency: 10
  timeout_seconds: 300

integrations:
  - name: workday
    type: hris
    config:
      api_version: v1

  - name: okta
    type: identity
    config:
      provision_on_complete: true

  - name: e_verify
    type: verification
    config:
      auto_submit: true

metadata:
  tags: [hr, onboarding, i9, compliance, provisioning]
  owner: hr_operations
  created_at: "2026-03-16"
